name: GitHub Readme Stats Generator

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate stats and languages cards
        uses: stats-organization/github-readme-stats-action@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          # Configure as opções dos cards conforme a documentação oficial do repositório

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
