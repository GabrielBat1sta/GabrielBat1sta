name: GitHub Readme Stats Generator

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Github Readme Stats
        uses: teoxoy/profile-readme-stats@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          # Força a action a gerar apenas as imagens soltas na pasta dist
          # sem tentar injetar dentro de um arquivo TEMPLATE.md
          template: "" 

      - name: Deploy to Repo
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
