name: GitHub Readme Stats Generator

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite rodar manualmente sempre que quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Utiliza uma action comunitária para gerar os SVGs locais
      - name: Generate Github Readme Stats
        uses: teoxoy/profile-readme-stats@v2
        with:
          token: ${{ secrets.GH_TOKEN }}
          output: dist
          # Opcional: configure o que deseja exibir (true/false)
          include_all_commits: true
          count_private_commits: true

      - name: Deploy to Repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
