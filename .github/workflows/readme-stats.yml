name: GitHub Readme Stats Generator

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Compact Metrics Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }}
          filename: github-metrics.svg
          
          # Configurações para deixar limpo e minimalista (Estilo Clássico)
          config_timezone: America/Sao_Paulo
          config_order: languages, base.activity
          
          # Remove o cabeçalho gigante (foto, nome, bio)
          base: activity, community, repositories
          base_hireable: no
          base_indepth: no
          
          # Ativa apenas a barra de linguagens compacta embaixo
          plugin_languages: true
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_indepth: no
          plugin_languages_limit: 5 # Mostra apenas as 5 principais
